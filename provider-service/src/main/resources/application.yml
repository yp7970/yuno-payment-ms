server:
  port: 8082

spring:
  application:
    name: provider-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/yuno_provider_db
    username: ${DB_USER:yuno}
    password: ${DB_PASS:yuno_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      pool-name: ProviderHikariPool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yuno.provider.model
  type-handlers-package: com.yuno.provider.config
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

# Simulated provider behaviour — set to 0.0 for deterministic tests
provider:
  a:
    failure-rate: ${PROVIDER_A_FAILURE_RATE:0.2}
    latency-ms: ${PROVIDER_A_LATENCY_MS:200}
  b:
    failure-rate: ${PROVIDER_B_FAILURE_RATE:0.15}
    latency-ms: ${PROVIDER_B_LATENCY_MS:150}

logging:
  level:
    com.yuno.provider: INFO
    org.springframework.retry: DEBUG
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [trxId=%X{transactionId:-}] [corrId=%X{correlationId:-}] [userId=%X{userId:-}] [svc=%X{serviceName:-}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/provider-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:provider_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

provider:
  a:
    failure-rate: 0.0
    latency-ms: 0
  b:
    failure-rate: 0.0
    latency-ms: 0
