server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/yuno_notification_db
    username: ${DB_USER:yuno}
    password: ${DB_PASS:yuno_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      pool-name: NotificationHikariPool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yuno.notification.model
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.yuno.notification: INFO
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [trxId=%X{transactionId:-}] [corrId=%X{correlationId:-}] [userId=%X{userId:-}] [svc=%X{serviceName:-}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/notification-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
