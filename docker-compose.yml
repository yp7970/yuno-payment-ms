version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Yuno Payment Orchestration — Microservices Docker Compose
#
# Services:          Ports
#   api-gateway      8080
#   payment-service  8081
#   provider-service 8082
#   idempotency-svc  8083
#   notification-svc 8084
#
# Infrastructure:
#   postgres         5432  (4 databases auto-created via init script)
#   redis            6379
#   kafka            9092
#   zookeeper        2181
#   kafka-ui         9090  (optional browser UI for Kafka topics)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  yuno-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: yuno-postgres
    environment:
      POSTGRES_USER: yuno
      POSTGRES_PASSWORD: yuno_secret
      POSTGRES_DB: yuno_payment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuno -d yuno_payment_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yuno-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: yuno-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: yuno-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Pre-create our topics on startup
      KAFKA_CREATE_TOPICS: >
        payment.initiated:1:1,
        payment.result:1:1,
        payment.notification:1:1,
        payment.initiated.DLT:1:1,
        payment.result.DLT:1:1,
        payment.notification.DLT:1:1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: yuno-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: yuno-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - yuno-network

  # ── Microservices ───────────────────────────────────────────────────────────

  idempotency-service:
    build:
      context: .
      dockerfile: idempotency-service/Dockerfile
    container_name: yuno-idempotency-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_USER: yuno
      DB_PASS: yuno_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: yuno-payment-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_USER: yuno
      DB_PASS: yuno_secret
      KAFKA_SERVERS: kafka:29092
      IDEMPOTENCY_SERVICE_URL: http://idempotency-service:8083
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      idempotency-service:
        condition: service_healthy
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  provider-service:
    build:
      context: .
      dockerfile: provider-service/Dockerfile
    container_name: yuno-provider-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_USER: yuno
      DB_PASS: yuno_secret
      KAFKA_SERVERS: kafka:29092
      PROVIDER_A_FAILURE_RATE: 0.2
      PROVIDER_B_FAILURE_RATE: 0.15
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: yuno-notification-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_USER: yuno
      DB_PASS: yuno_secret
      KAFKA_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - yuno-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: yuno-api-gateway
    ports:
      - "8080:8080"
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8081
      IDEMPOTENCY_SERVICE_URL: http://idempotency-service:8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - yuno-network
